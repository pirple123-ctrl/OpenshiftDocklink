apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-app
  labels:
    app: docling-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-app
  template:
    metadata:
      labels:
        app: docling-app
    spec:
      containers:
      - name: docling-app
        image: <TU_REGISTRY>/<TU_NAMESPACE>/docling-app:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
          name: http
        resources:
          requests:
            cpu: "1000m"
            memory: "4Gi"
          limits:
            cpu: "2000m"
            memory: "8Gi"
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: docling-app-service
  labels:
    app: docling-app
spec:
  selector:
    app: docling-app
  ports:
  - port: 8501
    targetPort: 8501
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: docling-app-route
  labels:
    app: docling-app
spec:
  to:
    kind: Service
    name: docling-app-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
